[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["*"]

[rpc_endpoints]
# Source: https://docs.arc.io/arc/references/connect-to-arc.md (verified 2026-07-16)
arc_testnet = "https://rpc.testnet.arc.network"

